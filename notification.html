

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>HelpHub AI — Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="toast" class="toast"></div>

<header id="navbar">
  <div class="container nav-inner">
    <a class="nav-logo" href="index.html"><div class="logo-icon">H</div><span class="logo-text">HelpHub AI</span></a>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-actions" id="navActions"></div>
  </div>
</header>

<div class="container page-wrap space-y">
  <div class="hero-grad">
    <div class="hero-content">
      <p class="label" style="color:#a8a29e;margin-bottom:8px;">NOTIFICATIONS</p>
      <h1 style="font-size:clamp(22px,4vw,36px);font-weight:900;color:#fff;line-height:1.2;">Stay updated on requests, helpers, and trust signals.</h1>
    </div>
  </div>
  <div class="glass p-6">
    <div class="flex items-center justify-between mb-6">
      <div><p class="label mb-2">LIVE UPDATES</p><h3 style="font-size:24px;font-weight:800;">Notification feed <span id="unreadCount" style="font-size:14px;font-weight:600;color:#0d9488;"></span></h3></div>
      <button class="btn-secondary" onclick="markAllRead()">Mark all as read</button>
    </div>
    <div id="notifList"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
currentPageName='notifications';
if(!requireAuth()){}else{
renderNavbar('notifications');

function renderPage(){
  const unreadCount = notifications.filter(n => !n.read).length;
  document.getElementById('notifList').innerHTML = notifications.length === 0
    ? '<p style="color:var(--text-400);font-size:14px;text-align:center;padding:2rem;">No notifications yet.</p>'
    : notifications.map(n=>`
    <div class="notif-row" onclick="markRead('${n.id}')" style="cursor:pointer;transition:background 0.2s;" onmouseover="this.style.background='#f5f5f4'" onmouseout="this.style.background=''">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
        ${!n.read ? '<span style="width:8px;height:8px;border-radius:50%;background:#0d9488;flex-shrink:0;"></span>' : '<span style="width:8px;height:8px;border-radius:50%;background:transparent;flex-shrink:0;border:1.5px solid #d6d3d1;"></span>'}
        <div style="flex:1;min-width:0;">
          <p class="${n.read?'notif-title-read':'notif-title-unread'}">${n.title}</p>
          <p class="notif-meta">${typeLabel(n.type)} • ${timeAgo(n.timestamp)}</p>
        </div>
      </div>
      <span class="${n.read?'notif-badge-read':'notif-badge-unread'}">${n.read?'Read':'Unread'}</span>
    </div>
  `).join('');
  // Update unread count in header
  const countEl = document.getElementById('unreadCount');
  if(countEl) countEl.textContent = unreadCount > 0 ? `${unreadCount} unread` : 'All caught up';
}
renderPage();
}
</script>
</body>
</html>
